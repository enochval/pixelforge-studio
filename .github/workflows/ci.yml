name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI runs through the same Docker Compose stack used for development, rather
# than installing PHP on the runner. Two reasons: the suite is then executed
# against the exact PHP version and extension set the application ships with,
# and the Dockerfile is exercised on every push instead of rotting until it is
# needed.

jobs:
  check:
    name: Lint, analyse, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Build application image
        run: docker compose build app

      - name: Install dependencies
        run: docker compose run --rm --no-deps app composer install --no-interaction --prefer-dist

      - name: Generate application key
        run: docker compose run --rm --no-deps app php artisan key:generate

      - name: Start backing services
        run: |
          docker compose up -d postgres redis
          docker compose ps

      - name: Code style
        run: docker compose run --rm app composer lint

      - name: Static analysis
        run: docker compose run --rm app composer analyse

      - name: Tests
        run: docker compose run --rm app ./vendor/bin/pest --ci

      - name: Service logs on failure
        if: failure()
        run: docker compose logs

  production-image:
    name: Production image builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build production target
        run: docker build --target production -t pixelforge:production .
